[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rejected-futures"
version = "0.1.0"
description = "A memory of the decisions your coding agent keeps forgetting, mined from the transcripts and git history already on your disk."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastembed>=0.7",
  "numpy>=1.26",
  "mcp>=1.2",
  "pyyaml>=6",
]

[project.scripts]
rf = "rejected_futures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rejected_futures = ["model.json", "commands/*.md"]
